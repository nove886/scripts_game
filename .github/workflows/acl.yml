name: Aclclouds-Renew

on:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PROXY: socks5://127.0.0.1:1080
  KATA_LINK: ${{ secrets.KATA_LINK }}

jobs:
  run_renewal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret 未配置，请在本仓库 Settings > Secrets and variables > Actions 中添加。"
            exit 1
          fi
          if [ -z "${{ secrets.ACL_COOKIE }}" ]; then
            echo "::error::ACL_COOKIE secret 未配置，请在本仓库 Settings > Secrets and variables > Actions 中添加。"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          repository: nove886/aclclouds-Renew-Private
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: Setup Chrome
        run: seleniumbase install chromedriver

      - name: Launch proxy tunnel
        if: ${{ env.KATA_LINK != '' }}
        run: bash scripts/setup_proxy.sh

      - name: Run Task (CF-Bypass Mode)
        env:
          COOKIE: ${{ secrets.ACL_COOKIE }}
          COOKIE_NAME: remember_web_59ba36addc2b2f9401580f014c7f58ea4e30989d
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USERID }}
          BASE_URL: https://dash.aclclouds.com
          MAX_RETRY: "20"
        run: xvfb-run -a python aclcloud-sb.py
