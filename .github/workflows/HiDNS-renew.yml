name: HiDNS Auto Renew

on:
  schedule:
    # 每月 1 日 UTC 20:17（北京时间 2 日 04:17）跑一次
    - cron: "17 20 1 * *"
  workflow_dispatch: {}   # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      # 公私库分离：公开仓库一律不执行续期（避免账号动态/日志被公开看到）
      # Variables：
      #   PY_PRIVATE_REPO   - 私库仓库名（owner/repo，如 my-name/hidoha-auto-renew），
      #                       被拦下时提示你该去哪个私有仓库跑
      #   ALLOW_PUBLIC_RUN  - 填 true 则公开仓库也放行（不推荐）
      - name: Guard - private repo only
        run: |
          RESP=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}")
          PRIV=$(echo "$RESP" | jq -r '.private // empty' 2>/dev/null || true)
          echo "仓库: ${{ github.repository }}  查询结果 private=[${PRIV}]"
          PRIVATE_REPO="${{ vars.PY_PRIVATE_REPO }}"
          if [ -n "$PRIVATE_REPO" ]; then
            echo "📌 指定的私库仓库: $PRIVATE_REPO"
          fi
          if [ -z "$PRIV" ]; then
            echo "⚠️ 无法查询仓库可见性（GitHub API 返回异常，可能是网络/限流），原始返回："
            printf '%s\n' "$RESP"
            echo "按公私库分离原则默认中止。若确认仓库是私有的，可在 Variables 设 ALLOW_PUBLIC_RUN=true 放行。"
            if [ "${{ vars.ALLOW_PUBLIC_RUN }}" = "true" ]; then
              exit 0
            fi
            exit 1
          fi
          if [ "$PRIV" != "true" ] && [ "${{ vars.ALLOW_PUBLIC_RUN }}" != "true" ]; then
            echo "当前是公开仓库，按公私库分离原则不在此执行续期。"
            if [ -n "$PRIVATE_REPO" ]; then
              echo "请把本仓库代码推到私库 https://github.com/$PRIVATE_REPO 并在那里配置 Secrets 运行；"
            else
              echo "请把本仓库代码推到一个【私有】仓库并在那里配置 Secrets 运行；"
              echo "（可在 Variables 设置 PY_PRIVATE_REPO=owner/repo 让提示直接带上私库地址）"
            fi
            echo "或在 Settings → Secrets and variables → Actions → Variables 添加 ALLOW_PUBLIC_RUN=true 放行。"
            exit 1
          fi
          echo "✔️ 仓库可见性校验通过（private=$PRIV）"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run renew
        env:
          EMAIL: ${{ secrets.HIDOHA_EMAIL }}
          PASSWORD: ${{ secrets.HIDOHA_PASSWORD }}
          API_TOKEN: ${{ secrets.HIDOHA_API_TOKEN }}
          ACCOUNTS: ${{ secrets.HIDOHA_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY: ${{ secrets.HIDOHA_PROXY }}
          DUE_DAYS: ${{ vars.DUE_DAYS }}
        run: python app.py
