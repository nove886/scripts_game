name: HiDNS Auto Renew

# 公开库（scripts_game）专用：只负责每月定时触发，不含任何业务 Secrets。
# 真正的续期在私库执行，见 .github/workflows/HiDNS-renew-run.yml。
#
# 本仓库需要配置：
#   Secrets   PRIVATE_REPO_PAT   - 能访问私库的 PAT（fine-grained: Contents:read + Actions:write）
#   Variables PY_PRIVATE_REPO    - 私库仓库名，格式 owner/repo

on:
  schedule:
    # 每月 1 日 UTC 20:17（北京时间 2 日 04:17）
    - cron: "17 20 1 * *"
  workflow_dispatch: {}   # 手动触发（调试用）

permissions:
  contents: read

concurrency:
  group: hidoha-renew-trigger
  cancel-in-progress: false

jobs:
  trigger-private:
    runs-on: ubuntu-latest
    steps:
      - name: 触发私库续期
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          TARGET_REPO: ${{ vars.PY_PRIVATE_REPO }}
        run: |
          if [ -z "$TARGET_REPO" ]; then
            echo "❌ 未设置 Variables.PY_PRIVATE_REPO（私库仓库名，格式 owner/repo）"
            echo "   Settings → Secrets and variables → Actions → Variables → PY_PRIVATE_REPO"
            exit 1
          fi
          # 格式校验：自动纠正常见误粘贴（完整 URL / .git / 尾斜杠），其余严格拦截
          case "$TARGET_REPO" in
            http://github.com/*|https://github.com/*|http://www.github.com/*|https://www.github.com/*)
              TARGET_REPO="${TARGET_REPO#*github.com/}"
              echo "ℹ️ 从完整链接识别到私库: ${TARGET_REPO}"
              ;;
            http://*|https://*)
              echo "❌ PY_PRIVATE_REPO 只能是 owner/repo（或 github.com/owner/repo），当前: ${TARGET_REPO}"
              exit 1
              ;;
          esac
          TARGET_REPO="${TARGET_REPO%.git}"
          TARGET_REPO="${TARGET_REPO%/}"
          if ! printf '%s' "$TARGET_REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "❌ PY_PRIVATE_REPO 格式错误: [${TARGET_REPO}]"
            echo "   正确格式: owner/repo，例如 nove886/hidoha-renew"
            echo "   不带协议、.git、尾部斜杠、空格，owner 和 repo 各一段"
            exit 1
          fi
          echo "🎯 目标私库: https://github.com/${TARGET_REPO}"
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 未配置 Secret PRIVATE_REPO_PAT（访问私库的 PAT）"
            echo "   Settings → Secrets and variables → Actions → Secrets → PRIVATE_REPO_PAT"
            exit 1
          fi

          echo "→ 触发私库 https://github.com/${TARGET_REPO} 执行续期"
          HTTP=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "{\"event_type\":\"hidoha-renew\",\"client_payload\":{\"source\":\"${GITHUB_REPOSITORY}\",\"run_id\":\"${GITHUB_RUN_ID}\"}}") || HTTP="000"

          echo "HTTP ${HTTP}"
          if [ -s resp.json ]; then
            cat resp.json
            echo ""
          fi

          case "$HTTP" in
            204)
              echo "✅ 已触发私库续期（执行日志去私库仓库的 Actions 页面查看）"
              ;;
            401)
              echo "❌ PAT 无效或已过期：重新生成 PRIVATE_REPO_PAT（fine-grained 需 Contents:read + Actions:write）"
              exit 1
              ;;
            403)
              echo "❌ PAT 权限不足或仓库无此工作流：确认私库已有 HiDNS-renew-run.yml 且在默认分支，PAT 对该库有 Actions:write"
              exit 1
              ;;
            404)
              echo "❌ 私库不存在或 PAT 无法访问：检查 PY_PRIVATE_REPO 是否为 owner/repo 且 PAT 指向该库"
              exit 1
              ;;
            *)
              echo "❌ 触发失败（HTTP ${HTTP}）"
              exit 1
              ;;
          esac
