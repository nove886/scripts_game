name: FGH-Renew
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FGH-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/renew.py renew.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 安装 jq
        run: sudo apt-get install -y jq

      - name: 🛡️ 启动 Hysteria2 代理转发
        if: ${{ env.HYSTERIA2_PROXY != '' }}
        env:
          HYSTERIA2_PROXY: ${{ secrets.HYSTERIA2_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/HyNetwork/hysteria/releases/latest | jq -r .tag_name | tr -d 'v')
          echo "📦 Hysteria2 版本: $VERSION"
          wget -q "https://github.com/HyNetwork/hysteria/releases/download/v${VERSION}/hysteria-linux-amd64-${VERSION}.tar.gz"
          tar -xzf "hysteria-linux-amd64-${VERSION}.tar.gz"
          chmod +x hysteria
          nohup ./hysteria server -t $HYSTERIA2_PROXY -l :8080 > hysteria.log 2>&1 &
          sleep 3
          IP=$(curl -s -x http://127.0.0.1:8080 https://api.ipify.org)
          IP_MASKED=$(echo "$IP" | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\.\)[0-9]*/\1xx/')
          echo "✅ Hysteria2 已启动，出口IP确认：$IP_MASKED"

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            x11-utils \
            xdotool \
            scrot

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          HYSTERIA2_PROXY: ${{ secrets.HYSTERIA2_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
