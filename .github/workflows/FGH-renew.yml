name: FGH-Renew
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  run_fgh_renew:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/FGH-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/renew.py renew.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 🛡️ 启动 Hysteria2 代理转发
        if: ${{ env.HY2_PROXY != '' }}
        env:
          HY2_PROXY: ${{ secrets.HY2_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/apernet/hysteria/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          echo "📦 Hysteria2 版本: $VERSION"
          wget -q "https://github.com/apernet/hysteria/releases/download/${VERSION}/hysteria-linux-amd64" \
            -O hysteria
          chmod +x hysteria
          # HY2_PROXY 格式: hysteria2://密码@服务器地址:端口
          HY2_SERVER=$(echo "$HY2_PROXY" | sed 's|hysteria2://[^@]*@||')
          HY2_PASS=$(echo "$HY2_PROXY" | sed 's|hysteria2://||' | cut -d@ -f1)
          cat > hy2-client.yaml << EOF
          server: "$HY2_SERVER"
          auth: "$HY2_PASS"
          http:
            listen: 127.0.0.1:8080
          EOF
          nohup ./hysteria client -c hy2-client.yaml > hy2.log 2>&1 &
          sleep 3
          IP=$(curl -s -x http://127.0.0.1:8080 https://api.ipify.org)
          IP_MASKED=$(echo "$IP" | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\.\)[0-9]*/\1xx/')
          echo "✅ Hysteria2 已启动，出口IP确认：$IP_MASKED"

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb \
            x11-utils \
            xdotool \
            scrot

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver

      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          FGH_ACCOUNT: ${{ secrets.FGH_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
