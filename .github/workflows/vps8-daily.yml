name: VPS8 Auto Sign-in

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点运行

env:
  VPS8_BATCH: ${{ secrets.VPS8_BATCH }}
  VPS8_HY2_URL: ${{ secrets.VPS8_HY2_URL }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 强制 Actions 使用 Node.js 24

jobs:
  auto_signin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install seleniumbase requests

      - name: Run VPS8 Sign-in
        run: python main.py
