name: 🟢 SlimeNodes 自动续期

on:
  schedule:
    - cron: '0 18 */2 * *'
  workflow_dispatch:
    inputs:
      account_count:
        description: '账号数量'
        required: true
        default: '2'

jobs:

  renew-0:
    name: 🔄 续期 - 账号 1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: 📥 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SlimeNodes_Renew_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖
        run: npm install

      - name: 🌐 安装 Playwright
        run: npx playwright install chromium --with-deps

      - name: 🛡️ 启动 GOST
        if: ${{ env.SLIME_GOST_PROXY != '' }}
        env:
          SLIME_GOST_PROXY: ${{ secrets.SLIME_GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$SLIME_GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          MASKED_IP=$(curl -s -x http://127.0.0.1:8080 https://api.ipify.org \
            | sed 's/\([0-9]*\.[0-9]*\)\..*/\1.**.**/g')
          echo "$MASKED_IP"

      - name: 🚀 执行续期
        env:
          SLIME_EMAIL:        ${{ secrets.SLIME_EMAIL_0 }}
          SLIME_PASSWORD:     ${{ secrets.SLIME_PASSWORD_0 }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SLIME_GOST_PROXY:   http://127.0.0.1:8080
        run: npx playwright test

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slime-screenshots-account-1
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  renew-1:
    name: 🔄 续期 - 账号 2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: 📥 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SlimeNodes_Renew_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖
        run: npm install

      - name: 🌐 安装 Playwright
        run: npx playwright install chromium --with-deps

      - name: 🛡️ 启动 GOST
        if: ${{ env.SLIME_GOST_PROXY != '' }}
        env:
          SLIME_GOST_PROXY: ${{ secrets.SLIME_GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$SLIME_GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          MASKED_IP=$(curl -s -x http://127.0.0.1:8080 https://api.ipify.org \
            | sed 's/\([0-9]*\.[0-9]*\)\..*/\1.**.**/g')
          echo "$MASKED_IP"

      - name: 🚀 执行续期
        env:
          SLIME_EMAIL:        ${{ secrets.SLIME_EMAIL_1 }}
          SLIME_PASSWORD:     ${{ secrets.SLIME_PASSWORD_1 }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SLIME_GOST_PROXY:   http://127.0.0.1:8080
        run: npx playwright test

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slime-screenshots-account-2
          path: |
            test-results/
            playwright-report/
          retention-days: 7
