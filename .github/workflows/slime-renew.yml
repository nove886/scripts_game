name: 🟢 SlimeNodes 自动续期

on:
  schedule:
    - cron: '0 18 */2 * *'
  workflow_dispatch:

jobs:

  # ==========================================
  # 生成账号矩阵
  # ==========================================
  prepare:
    name: 📋 生成账号矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}

    steps:
      - name: 📋 解析账号列表
        id: gen
        env:
          SLIME_ACCOUNTS: ${{ secrets.SLIME_ACCOUNTS }}
        run: |
          # SLIME_ACCOUNTS 格式（JSON数组）:
          # [
          #   {"email":"a@x.com","password":"pass1"},
          #   {"email":"b@x.com","password":"pass2"}
          # ]
          MATRIX=$(echo "$SLIME_ACCOUNTS" | jq -c '{include: [.[] | {email: .email, password: .password}]}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # ==========================================
  # 每个账号独立续期
  # ==========================================
  renew:
    name: 🔄 续期 - ${{ matrix.email }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false   # 一个账号失败不影响其他账号

    steps:

      - name: 📥 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SlimeNodes_Renew_Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖
        run: npm install

      - name: 🌐 安装 Playwright
        run: npx playwright install chromium --with-deps

      - name: 🛡️ 启动 GOST
        if: ${{ env.SLIME_GOST_PROXY != '' }}
        env:
          SLIME_GOST_PROXY: ${{ secrets.SLIME_GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST VERSION: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$SLIME_GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          echo "✅ 测试代理"
          MASKED_IP=$(curl -s -x http://127.0.0.1:8080 https://api.ipify.org \
            | sed 's/\([0-9]*\.[0-9]*\)\..*/\1.**.**/g')
          echo "$MASKED_IP"

      - name: 🚀 执行续期
        env:
          # 将 matrix 中的账号映射到代码读取的变量名，代码零修改
          SLIME_EMAIL:        ${{ matrix.email }}
          SLIME_PASSWORD:     ${{ matrix.password }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SLIME_GOST_PROXY:   http://127.0.0.1:8080
        run: npx playwright test

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 用邮箱前缀区分，避免多账号 artifact 互相覆盖
          name: slime-screenshots-${{ matrix.email }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
