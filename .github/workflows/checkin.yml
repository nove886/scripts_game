name: 每日自动签到

on:
  schedule:
    # UTC 时间 0:10，对应北京时间早上 8:10，可自行调整
    - cron: "10 0 * * *"
  workflow_dispatch: {}  # 允许手动触发，方便调试

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到
        env:
          EMBY_USERNAME: ${{ secrets.EMBY_USERNAME }}
          EMBY_PASSWORD: ${{ secrets.EMBY_PASSWORD }}
        run: python checkin.py
