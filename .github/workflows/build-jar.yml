name: Build NanoLimbo and upload jar to Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew clean shadowJar

      - name: Prepare JAR
        id: prepare_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          cp "$JAR_PATH" ./server.jar
          echo "JAR_SIZE=$(ls -lh ./server.jar | awk '{print $5}')" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoLimbo-artifact
          path: server.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: NanoLimbo-artifact

      # 发布到公库，使用 PAT 授权（需在私库 Secrets 中配置 PUBLIC_REPO_TOKEN）
      - name: Create Release on Public Repo
        uses: ncipollo/release-action@v1
        with:
          artifacts: "server.jar"
          # 指定公库，格式：owner/public-repo-name（按实际修改）
          repo: "YourOrg/NanoLimbo-public"
          tag: "build-${{ github.run_number }}"
          name: "NanoLimbo build-${{ github.run_number }}"
          # 使用对公库有 write 权限的 PAT，而非默认的 GITHUB_TOKEN
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          body: |
            Automated release from private build #${{ github.run_number }}
            Commit: ${{ github.sha }}
