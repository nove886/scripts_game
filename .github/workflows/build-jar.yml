name: Build NanoLimbo and upload jar to Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 无需额外 token，直接 checkout 当前私库（NanoLimbo）

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle wrapper && chmod +x gradlew && ./gradlew clean shadowJar

      - name: Prepare JAR
        id: prepare_jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          cp "$JAR_PATH" ./server.jar
          echo "JAR_SIZE=$(ls -lh ./server.jar | awk '{print $5}')" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoLimbo-artifact
          path: server.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: NanoLimbo-artifact

      - name: Create Release on Public Repo
        uses: ncipollo/release-action@v1
        with:
          artifacts: "server.jar"
          # 填写公库路径，格式：owner/repo-name
          repo: "YourOrg/NanoLimbo-public"
          tag: "build-${{ github.run_number }}"
          name: "NanoLimbo build-${{ github.run_number }}"
          # 只需要这一个 PAT：对公库有 Contents write 权限
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          body: |
            Automated release from private build #${{ github.run_number }}
            Commit: ${{ github.sha }}
